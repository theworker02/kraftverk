<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Kraftverk evidence loop: Measure, Experiment, Validate, Improve" class="flow-animate">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d9a8b"/>
      <stop offset="100%" stop-color="#2a6f8a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9aab"/>
    </marker>
    <style>
      .node { opacity: 0; animation: node-in 0.55s cubic-bezier(0.22,1,0.36,1) forwards; }
      .n1 { animation-delay: 0.15s; }
      .n2 { animation-delay: 0.3s; }
      .n3 { animation-delay: 0.45s; }
      .n4 { animation-delay: 0.6s; }
      .edge { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 0.7s ease forwards; }
      .e1 { animation-delay: 0.25s; }
      .e2 { animation-delay: 0.4s; }
      .e3 { animation-delay: 0.55s; }
      .feedback { stroke-dasharray: 8 5; stroke-dashoffset: 120; opacity: 0; animation: feedback 1.4s ease 0.75s forwards; }
      @keyframes node-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes feedback { to { stroke-dashoffset: 0; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .node, .edge, .feedback { opacity: 1; stroke-dashoffset: 0; animation: none !important; }
      }
    </style>
  </defs>
  <rect width="720" height="220" rx="12" fill="#0b0e11"/>
  <text x="36" y="36" fill="#8b9aab" font-family="Familjen Grotesk, IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="0.08em">KRAFTVERK EVIDENCE LOOP</text>

  <g font-family="Familjen Grotesk, IBM Plex Sans, Segoe UI, sans-serif">
    <g class="node n1">
      <rect x="36" y="72" width="140" height="76" rx="8" fill="#12171d" stroke="url(#accent)" stroke-width="2"/>
      <text x="106" y="106" text-anchor="middle" fill="#e8eef4" font-size="18" font-weight="600">Measure</text>
      <text x="106" y="128" text-anchor="middle" fill="#8b9aab" font-size="12">KraftBench</text>
    </g>
    <g class="node n2">
      <rect x="206" y="72" width="140" height="76" rx="8" fill="#12171d" stroke="#243040" stroke-width="2"/>
      <text x="276" y="106" text-anchor="middle" fill="#e8eef4" font-size="18" font-weight="600">Experiment</text>
      <text x="276" y="128" text-anchor="middle" fill="#8b9aab" font-size="12">reversible diffs</text>
    </g>
    <g class="node n3">
      <rect x="376" y="72" width="140" height="76" rx="8" fill="#12171d" stroke="#243040" stroke-width="2"/>
      <text x="446" y="106" text-anchor="middle" fill="#e8eef4" font-size="18" font-weight="600">Validate</text>
      <text x="446" y="128" text-anchor="middle" fill="#8b9aab" font-size="12">stats + restore</text>
    </g>
    <g class="node n4">
      <rect x="546" y="72" width="140" height="76" rx="8" fill="#12171d" stroke="url(#accent)" stroke-width="2"/>
      <text x="616" y="106" text-anchor="middle" fill="#e8eef4" font-size="18" font-weight="600">Improve</text>
      <text x="616" y="128" text-anchor="middle" fill="#8b9aab" font-size="12">keep or revert</text>
    </g>
  </g>

  <line class="edge e1" x1="176" y1="110" x2="206" y2="110" stroke="#8b9aab" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="edge e2" x1="346" y1="110" x2="376" y2="110" stroke="#8b9aab" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="edge e3" x1="516" y1="110" x2="546" y2="110" stroke="#8b9aab" stroke-width="2" marker-end="url(#arrow)"/>

  <path class="feedback" d="M616 148 C616 188 106 188 106 148" fill="none" stroke="#3d9a8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="204" text-anchor="middle" fill="#8b9aab" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">Learn · Repeat (no fabricated telemetry)</text>
</svg>
