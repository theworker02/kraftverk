[package]
name = "kraftverk-bench"
description = "KraftBench deterministic performance benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = ["gpu"]
gpu = ["dep:ash", "dep:libloading"]

[dependencies]
kraftverk-core = { workspace = true }
kraftverk-system = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
chrono = { workspace = true }
ash = { version = "0.38", optional = true, default-features = false, features = ["loaded", "std"] }
libloading = { version = "0.8", optional = true }

[build-dependencies]
naga = { version = "24", default-features = false, features = ["wgsl-in", "spv-out"] }
bytemuck = "1"

[dev-dependencies]
approx = "0.5"
