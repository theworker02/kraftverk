[package]
name = "kraftverk-system"
description = "Platform, hardware inspection, sensors, and telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
kraftverk-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
sysinfo = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[features]
default = []
# Dev/test only: inject mock hardware facts / MockPlatform eligibility matrix.
# Must NEVER be used as a production --force bypass.
mock-platform = []
# Alias kept for early drafts; prefer mock-platform.
mock-hardware = ["mock-platform"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
