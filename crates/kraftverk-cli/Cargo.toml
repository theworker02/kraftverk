[package]
name = "kraftverk-cli"
description = "Kraftverk command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "kraftverk"
path = "src/main.rs"

[features]
default = []
dev-simulate = []

[dependencies]
kraftverk-core = { workspace = true }
kraftverk-system = { workspace = true }
kraftverk-bench = { workspace = true }
kraftverk-optimizer = { workspace = true }
kraftverk-data = { workspace = true }
kraftverk-agent = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
tempfile = { workspace = true }
