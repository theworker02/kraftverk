name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: kraftverk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: kraftverk.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --workspace
      - name: build release bins
        run: |
          cargo build --release -p kraftverk-cli
          cargo build --release -p kraftverk-desktop
      - name: package
        shell: bash
        run: |
          STAGE=kraftverk-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p dist/$STAGE
          if [ -f target/release/${{ matrix.bin }} ]; then
            cp target/release/${{ matrix.bin }} dist/$STAGE/
          else
            cp target/release/kraftverk dist/$STAGE/
          fi
          cp target/release/kraftverk-desktop dist/$STAGE/ 2>/dev/null || cp target/release/kraftverk-desktop.exe dist/$STAGE/ 2>/dev/null || true
          cp README.md LICENSE CHANGELOG.md dist/$STAGE/
          cd dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a $STAGE.zip $STAGE
            sha256sum $STAGE.zip > $STAGE.zip.sha256
          else
            tar czf $STAGE.tar.gz $STAGE
            sha256sum $STAGE.tar.gz > $STAGE.tar.gz.sha256
          fi
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kraftverk-${{ matrix.target }}
          path: dist/*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Proprietary software © theworker02 — All Rights Reserved.
            See LICENSE in the archive. Modification and redistribution of modified versions require written permission.
            AMD-exclusive (`amd-only-v1`). Not affiliated with AMD.
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
