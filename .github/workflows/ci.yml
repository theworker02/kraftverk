name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Hardware policy notes (amd-only-v1):
# - GitHub-hosted runners are typically Intel CPU and often lack AMD GPUs.
# - Unit/integration tests must NOT require live AMD hardware. The `test` step
#   enables `kraftverk-system/mock-platform` so eligibility matrix tests inject
#   facts via MockPlatform / evaluate_from_facts — never a production CLI flag.
# - The `build` / `clippy` steps compile the real release gate (no mock feature).
# - There is no `--force` / `--ignore-hardware` / KRAFTVERK_SKIP_HARDWARE_GATE
#   switch in release binaries. Do not add one here or in release.yml.
# - GPU benches skip cleanly when Vulkan/AMD is absent (Unsupported status).
# See docs/hardware-support.md and DEVELOPMENT.md.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      # Clippy without mock-platform — catches Linux-cfg type errors (e.g. sensors).
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # mock-platform: test-only feature for injected hardware facts. Not shipped
      # as a user-facing bypass; production amd-only-v1 gate remains in release builds.
      - name: test
        run: cargo test --workspace --features kraftverk-system/mock-platform
      # Release build keeps amd-only-v1; runners may be Intel — compile-only is fine.
      - name: build
        run: cargo build --workspace --release

  # Optional Tauri shell — does not fail the main workspace job if WebView deps are missing.
  tauri:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: check tauri-app feature
        run: cargo check -p kraftverk-desktop --no-default-features --features tauri-app

  # Non-x86 targets are rejected at compile time (amd-only-v1).
  # Do not add macOS/ARM release or CI build jobs.

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true
      - name: dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true
