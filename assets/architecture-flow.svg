<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Kraftverk evidence loop: Measure, Experiment, Validate, Improve">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d9a8b"/>
      <stop offset="100%" stop-color="#2a6f8a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9aab"/>
    </marker>
  </defs>
  <rect width="720" height="220" rx="12" fill="#0b0e11"/>
  <text x="36" y="36" fill="#8b9aab" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="0.08em">KRAFTVERK EVIDENCE LOOP</text>

  <!-- Nodes -->
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif">
    <rect x="36" y="72" width="140" height="76" rx="8" fill="#12171d" stroke="url(#accent)" stroke-width="2"/>
    <text x="106" y="106" text-anchor="middle" fill="#e8eef4" font-size="18" font-weight="600">Measure</text>
    <text x="106" y="128" text-anchor="middle" fill="#8b9aab" font-size="12">KraftBench</text>

    <rect x="206" y="72" width="140" height="76" rx="8" fill="#12171d" stroke="#243040" stroke-width="2"/>
    <text x="276" y="106" text-anchor="middle" fill="#e8eef4" font-size="18" font-weight="600">Experiment</text>
    <text x="276" y="128" text-anchor="middle" fill="#8b9aab" font-size="12">reversible diffs</text>

    <rect x="376" y="72" width="140" height="76" rx="8" fill="#12171d" stroke="#243040" stroke-width="2"/>
    <text x="446" y="106" text-anchor="middle" fill="#e8eef4" font-size="18" font-weight="600">Validate</text>
    <text x="446" y="128" text-anchor="middle" fill="#8b9aab" font-size="12">stats + restore</text>

    <rect x="546" y="72" width="140" height="76" rx="8" fill="#12171d" stroke="url(#accent)" stroke-width="2"/>
    <text x="616" y="106" text-anchor="middle" fill="#e8eef4" font-size="18" font-weight="600">Improve</text>
    <text x="616" y="128" text-anchor="middle" fill="#8b9aab" font-size="12">keep or revert</text>
  </g>

  <!-- Forward arrows -->
  <line x1="176" y1="110" x2="206" y2="110" stroke="#8b9aab" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="346" y1="110" x2="376" y2="110" stroke="#8b9aab" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="516" y1="110" x2="546" y2="110" stroke="#8b9aab" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feedback path -->
  <path d="M616 148 C616 188 106 188 106 148" fill="none" stroke="#3d9a8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="360" y="204" text-anchor="middle" fill="#8b9aab" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">Learn ’ Repeat (no fabricated telemetry)</text>
</svg>
