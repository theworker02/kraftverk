[workspace]
resolver = "2"
members = [
    "crates/kraftverk-core",
    "crates/kraftverk-system",
    "crates/kraftverk-bench",
    "crates/kraftverk-optimizer",
    "crates/kraftverk-data",
    "crates/kraftverk-agent",
    "crates/kraftverk-sdk",
    "crates/kraftverk-cli",
    "crates/kraftverk-desktop",
    "tests",
]
default-members = ["crates/kraftverk-cli"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/theworker02/kraftverk"
homepage = "https://theworker02.github.io/kraftverk/"
rust-version = "1.75"
authors = ["theworker02"]

[workspace.dependencies]
kraftverk-core = { path = "crates/kraftverk-core" }
kraftverk-system = { path = "crates/kraftverk-system" }
kraftverk-bench = { path = "crates/kraftverk-bench" }
kraftverk-optimizer = { path = "crates/kraftverk-optimizer" }
kraftverk-data = { path = "crates/kraftverk-data" }
kraftverk-agent = { path = "crates/kraftverk-agent" }
kraftverk-sdk = { path = "crates/kraftverk-sdk" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
sysinfo = "0.33"
indicatif = "0.17"
directories = "5"
tempfile = "3"
once_cell = "1"
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
